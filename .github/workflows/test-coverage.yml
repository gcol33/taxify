name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # Setup steps download the toolchain from external CDNs and occasionally
      # hit transient 5xx. Each runs once with continue-on-error, then a guarded
      # second attempt covers a transient failure without failing the job.
      - name: Setup R
        id: setup-r
        continue-on-error: true
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://gcol33.r-universe.dev

      - name: Setup R (retry)
        if: steps.setup-r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://gcol33.r-universe.dev

      - name: Install dependencies
        id: deps
        continue-on-error: true
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Install dependencies (retry)
        if: steps.deps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' && true || false }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
