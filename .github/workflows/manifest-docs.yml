name: manifest-docs

# The backbone tables, download sizes and enrichment count in README.md and the
# vignettes are generated from inst/manifest.json. A manifest sync that does not
# regenerate them leaves a second, wrong copy of every figure, which is how they
# drifted before.
#
# taxifydb's sync opens a PR carrying inst/manifest.json alone, so every merged
# sync leaves the generated blocks a release behind and this workflow red. It
# was red for 25 consecutive runs before anyone regenerated by hand. A pull
# request is still only checked, since a fork cannot be written to; a push to
# the default branch regenerates and commits, so a merged sync repairs itself.
#
# Fix a failing pull request with:
#
#   Rscript scripts/sync-readme-stats.R

on:
  push:
    branches: [main, master]
    paths:
      - 'inst/manifest.json'
      - 'README.md'
      - 'vignettes/**'
      - 'R/backbones.R'
      - 'scripts/manifest-stats.R'
      - 'scripts/sync-readme-stats.R'
  pull_request:
    paths:
      - 'inst/manifest.json'
      - 'README.md'
      - 'vignettes/**'
      - 'R/backbones.R'
      - 'scripts/manifest-stats.R'
      - 'scripts/sync-readme-stats.R'
  workflow_dispatch:

# Two syncs landing close together would otherwise both regenerate and race to
# push; the second would be rejected as non-fast-forward and leave the workflow
# red for a state it had already repaired.
concurrency:
  group: manifest-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://gcol33.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::jsonlite, any::pkgload

      - name: Documentation figures match the manifest
        run: Rscript scripts/sync-readme-stats.R --check

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://gcol33.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::jsonlite, any::pkgload

      - name: Regenerate the manifest-derived blocks
        run: Rscript scripts/sync-readme-stats.R

      - name: Commit the regenerated blocks
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::notice title=manifest-docs::Generated blocks already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: regenerate the manifest-derived blocks"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "::notice title=manifest-docs::Regenerated blocks committed."

      - name: The blocks are current
        run: Rscript scripts/sync-readme-stats.R --check
