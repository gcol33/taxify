name: e2e-accuracy

# Accuracy regression against the curated EVA-to-WFO corpus.
#
# The corpus is access-restricted vegetation-plot data and the run needs the
# installed WFO backbone, so this cannot execute on a GitHub-hosted runner.
# Dispatch it against a runner that already holds both. Not scheduled, so it
# never queues against a runner that does not exist.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label holding the backbones and the corpus
        required: true
        default: self-hosted
      corpus:
        description: >
          Path to the EVA-to-WFO ground-truth CSV on that runner. Leave empty
          to use the TAXIFY_ASAAS_CORPUS repository variable.
        required: false
        default: ""

jobs:
  accuracy:
    runs-on: ${{ inputs.runner }}

    env:
      TAXIFY_ASAAS_CORPUS: ${{ inputs.corpus || vars.TAXIFY_ASAAS_CORPUS }}

    steps:
      - uses: actions/checkout@v4

      # The tests skip when the corpus is absent. A dispatched run that skips
      # everything would report success while measuring nothing, so fail here
      # instead.
      - name: Require the corpus
        shell: bash
        run: |
          if [ -z "${TAXIFY_ASAAS_CORPUS}" ]; then
            echo "TAXIFY_ASAAS_CORPUS is unset. Pass the corpus input or set the repository variable." >&2
            exit 1
          fi
          if [ ! -f "${TAXIFY_ASAAS_CORPUS}" ]; then
            echo "Corpus not found on this runner: ${TAXIFY_ASAAS_CORPUS}" >&2
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::testthat

      - name: Run the accuracy regression
        shell: Rscript {0}
        run: |
          devtools::load_all(".")
          res <- testthat::test_file(
            "tests/e2e/test-asaas-validation.R",
            reporter = testthat::MultiReporter$new(list(
              testthat::ProgressReporter$new(),
              testthat::CheckReporter$new()
            ))
          )
          df <- as.data.frame(res)
          if (sum(df$failed) > 0 || any(df$error)) {
            stop("Accuracy regression failed.")
          }
          # A silent all-skip means the corpus or the backbone was missing.
          if (sum(df$passed) == 0) {
            stop("No assertions ran: the corpus or the WFO backbone is missing.")
          }
